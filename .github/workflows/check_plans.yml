# Check the plan folders changed by a push or pull request: folder names,
# plan chaining, plan line format and target coordinates against catalogs.
# check_objects.py decides what there is to check and writes the report to the
# job summary.
#
# The check-plans job always runs (no path filters, no "if:"), so it can be a
# required status check on main. The unit tests are a separate job so that a
# PyPI outage while installing pytest cannot block the required check.

name: Check ACP plans

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  check-plans:
    name: check-plans
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      with:
        # Full history, so the base commit is available to git.
        fetch-depth: 0
    - name: Set up Python 3.11
      uses: actions/setup-python@v7
      with:
        python-version: "3.11"
    - name: Check changed plan folders
      env:
        EVENT_NAME: ${{ github.event_name }}
        PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        PUSH_BEFORE_SHA: ${{ github.event.before }}
      run: |
        set -uo pipefail

        if [ "$EVENT_NAME" = "pull_request" ]; then
          base="$PR_BASE_SHA"
        else
          base="$PUSH_BEFORE_SHA"
        fi
        # A push that creates a branch has an all-zero "before"; fall back to
        # the parent commit if the base is missing or unknown.
        if [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
          echo "Base commit '$base' not available; comparing with HEAD~1."
          base="HEAD~1"
        fi

        python check_objects.py --base "$base"

  unit-tests:
    name: unit-tests
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python 3.11
      uses: actions/setup-python@v7
      with:
        python-version: "3.11"
    - name: Install pytest
      run: python -m pip install pytest
    - name: Run the tests
      run: python -m pytest tests/

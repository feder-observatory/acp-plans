# Check the folder name, plan chaining and target coordinates of every plan
# folder changed by a pull request, and that every target is in the object list.

name: Check ACP chaining

on:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 2   # HEAD is the PR merged into main; HEAD^ is main
    - uses: actions/setup-python@v7
      with:
        python-version: "3.13"
    - run: pip install astropy astroquery
    - name: No plan files at the top of the repository
      run: |
        root=$(git diff --name-only --diff-filter=AM HEAD^ -- ':(glob)*.txt')
        if [ -n "$root" ]; then
          echo "Put plan files in a YYYY-MM-DD folder, not at the top of the repository: $root"
          exit 1
        fi
    - name: Check folder names and plan chaining
      if: success() || failure()
      shell: bash   # adds pipefail, so a failing git diff fails the step
      run: |
        git -c core.quotePath=false diff --name-only --no-renames HEAD^ -- '*/*' ':!.github' ':!tests' \
          | cut -d/ -f1 | sort -u | while IFS= read -r folder; do
          [ -d "$folder" ] || continue   # folder deleted by the PR
          echo "Checking $folder"
          python check_folder_names.py -- "$folder"
          python plan_check.py -- "$folder"
        done
    - name: Check target coordinates and the object list
      if: success() || failure()   # report coordinates even if chaining failed
      shell: bash
      # With no plan files changed xargs still runs the script once, which
      # checks feder_object_list.csv on its own.
      run: |
        git diff -z --name-only --no-renames --diff-filter=AM HEAD^ -- '20*/*.txt' \
          | xargs -0 python check_coordinates.py
